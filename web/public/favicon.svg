<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#aa5fff"/>
      <stop offset="100%" stop-color="#6200cc"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle top gloss -->
  <rect width="32" height="32" rx="7" fill="url(#shine)"/>

  <!-- Main 4-pointed sparkle, slightly elongated on vertical axis -->
  <path d="M16 3
    Q16.6 11.5 19.2 14.8
    Q22.5 16 29 16
    Q22.5 16 19.2 17.2
    Q16.6 20.5 16 29
    Q15.4 20.5 12.8 17.2
    Q9.5 16 3 16
    Q9.5 16 12.8 14.8
    Q15.4 11.5 16 3 Z"
    fill="white"/>

  <!-- Small secondary sparkle (top-right accent) -->
  <path d="M24 5
    Q24.3 8 25.5 9.2
    Q27 9.8 26.5 9.8
    Q27 9.8 25.5 10.3
    Q24.3 11.5 24 14
    Q23.7 11.5 22.5 10.3
    Q21 9.8 22.5 9.8
    Q21 9.8 22.5 9.2
    Q23.7 8 24 5 Z"
    fill="white" opacity="0.75"/>

  <!-- Tiny dot accent (bottom-right) -->
  <circle cx="25.5" cy="22.5" r="1.4" fill="white" opacity="0.45"/>
</svg>
