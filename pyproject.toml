[project]
name = "alsie"
version = "0.1.0"
description = "An interactive environment for crafting programmatic animations and slides in Python."
readme = "README.md"
authors = [
    { name = "Ada Bohm", email = "ada@kreatrix.org" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
alsie = "alsie:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
]
