[project]
name = "fairyflow"
version = "0.1.0"
description = "An interactive environment for crafting programmatic animations and slides in Python."
readme = "README.md"
authors = [
    { name = "Ada Bohm", email = "ada@kreatrix.org" }
]
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.22.9",
    "tinycss2>=1.4.0",
]

[project.scripts]
fairyflow = "fairyflow._server:main"
fairyflow-compile = "fairyflow.__main__:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "pymupdf>=1.24.0",
    "zensical>=0.0.31",
    "fairyflow-zensical",
    "pdoc>=16.0.0",
    "pymupdf",
    "websockets>=14",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.12",
]

[tool.uv.sources]
fairyflow-zensical = { path = "fairyflow-zensical", editable = true }
